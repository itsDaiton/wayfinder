name: ci

# Every PR to main, Dependabot's included. Not a required check: the release PR gets no run
# (AGENTS.md → CI).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit. Dependabot updates the hash and the version comment.
jobs:
  # The supply-chain rules in pnpm-workspace.yaml apply to the install: a lockfile entry that's too
  # new or a trust downgrade fails it, and the checks are skipped.
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # No version input: it installs the version in package.json's packageManager. The cache
      # saves the pnpm store for the check jobs.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

  # Jobs don't share files, so each check installs again, from the pnpm store cached above.
  check:
    name: ${{ matrix.name }}
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Let every check finish even when one fails, so one run reports all the problems.
      fail-fast: false
      matrix:
        include:
          - name: lint
            script: lint
          - name: format
            script: format:check
          - name: typecheck
            script: typecheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm ${{ matrix.script }}
